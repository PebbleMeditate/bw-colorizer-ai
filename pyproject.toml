[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bw-colorizer-ai"
version = "0.4.2"
description = "AI colorizer: B&W to color generator for Windows desktop"
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bw-colorizer-ai contributors" }]
keywords = ["colorization", "image", "onnx", "torch", "desktop", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "Pillow>=10.3,<12",
    "numpy>=1.26,<3",
    "onnxruntime>=1.18,<2 ; platform_system=='Windows'",
    "tomli>=2.0 ; python_version<'3.11'",
    "rich>=13.7,<14",
]

[project.optional-dependencies]
torch = ["torch>=2.3,<3", "torchvision>=0.18,<1"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-Pillow>=10.2",
]

[project.scripts]
bw-colorizer = "colorizer.bootstrap.cli:main"
bw-colorizer-gui = "colorizer.bootstrap.gui:main"

[project.gui-scripts]
bw-colorizer-desktop = "colorizer.bootstrap.gui:main"

[tool.setuptools.packages.find]
include = ["colorizer*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["colorizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=colorizer --cov-report=term-missing"